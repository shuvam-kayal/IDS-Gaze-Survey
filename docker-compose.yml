services:
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://attention:attention@db:5432/attention
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./:/app"]
    command: uvicorn services.api.app:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: attention, POSTGRES_USER: attention, POSTGRES_PASSWORD: attention}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U attention -d attention"], interval: 5s, timeout: 3s, retries: 15}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes: {postgres-data: {}}
