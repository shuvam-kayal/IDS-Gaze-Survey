[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-gaze-survey"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0", "jsonschema>=4.23,<5.0"]

[tool.setuptools.packages.find]
include = ["services*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
